function slug(t){return t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
const search=document.getElementById('search'), category=document.getElementById('category'), format=document.getElementById('format'), grid=document.getElementById('grid'), count=document.getElementById('count');
const genres=[...new Set(films.map(f=>f.genre))].sort();for(const g of genres){const o=document.createElement('option');o.value=g;o.textContent=g;category.append(o)}
function render(){
 const q=search.value.trim().toLowerCase(),g=category.value,fmt=format.value;
 const shown=films.filter(f=>(fmt==='all'||f.collection===fmt)&&(g==='all'||f.genre===g)&&(f.title+' '+f.genre+' '+(f.description||'')).toLowerCase().includes(q));
 count.textContent=shown.length+' of '+films.length+' catalogue entries shown ('+films.filter(f=>f.collection==='3D').length+' 3D / '+films.filter(f=>f.collection==='2D').length+' 2D)';
 grid.replaceChildren();
 for(const f of shown){
  const card=document.createElement('article');card.className='card';const poster=document.createElement('div');poster.className='poster';poster.textContent=f.title;
  const im=document.createElement('img');im.loading='lazy';im.alt=f.title+' poster';im.onerror=()=>im.remove();im.src='posters/'+slug(f.title)+'.jpg';poster.append(im);
  const body=document.createElement('div');body.className='content';const tag=document.createElement('div');tag.className='tag';tag.textContent=f.collection+' • '+f.genre;
  const h=document.createElement('h2');h.textContent=f.title;body.append(tag,h);
  if(f.description){const d=document.createElement('p');d.textContent=f.description;body.append(d)}
  if(f.format&&(/check|verify|standard|DVD/i.test(f.format))){const flag=document.createElement('div');flag.className='flag';flag.textContent=f.format;body.append(flag)}
  const imdb=document.createElement('a');imdb.textContent='IMDb ↗';imdb.href='https://www.imdb.com/find/?q='+encodeURIComponent(f.title);imdb.target='_blank';imdb.rel='noopener noreferrer';imdb.style.cssText='display:block;margin:12px 0 0;padding:10px;background:#e6b84c;color:#111;border-radius:6px;text-align:center;text-decoration:none;font-weight:bold';body.append(imdb);
  card.append(poster,body);grid.append(card);
 }
}
search.addEventListener('input',render);category.addEventListener('change',render);format.addEventListener('change',render);render();
