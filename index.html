// Only display unique title entries. Film titles are transcribed from the user's photographs;
// some format and edition details still need checking against the physical cases.
function slug(t){return t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
const unique=[...new Map(films.map(f=>[f[0].toLowerCase(),f])).values()];const search=document.getElementById('search'),category=document.getElementById('category'),grid=document.getElementById('grid'),count=document.getElementById('count');const genres=[...new Set(unique.flatMap(f=>f[1].split(' / ')))].sort();for(const g of genres){const o=document.createElement('option');o.value=g;o.textContent=g;category.append(o)}function render(){const q=search.value.trim().toLowerCase(),g=category.value;const shown=unique.filter(f=>(g==='all'||f[1].split(' / ').includes(g))&&(f[0]+' '+f[1]+' '+f[2]).toLowerCase().includes(q));count.textContent=shown.length+' films shown';grid.replaceChildren();for(const f of shown){const card=document.createElement('article');card.className='card';const poster=document.createElement('div');poster.className='poster';poster.textContent=f[0];const image=document.createElement('img');image.loading='lazy';image.alt=f[0]+' poster';image.onerror=()=>image.remove();image.src='posters/'+slug(f[0])+'.jpg';poster.append(image);const body=document.createElement('div');body.className='content';const tag=document.createElement('div');tag.className='tag';tag.textContent=f[1];const h=document.createElement('h2');h.textContent=f[0];const d=document.createElement('p');d.textContent=f[2];body.append(tag,h,d);card.append(poster,body);grid.append(card)}}search.addEventListener('input',render);category.addEventListener('change',render);render();
